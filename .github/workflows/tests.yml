name: CI

on:
  push:
    branches: [main]
    paths: ["frontend/restaurant-frontend-app/**"]
  pull_request:
    paths: ["frontend/restaurant-frontend-app/**"]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  build-test:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend/restaurant-frontend-app
    env:
      RP_PROJECT: restaurant-app-autotests
      RP_LAUNCH: Frontend unit tests
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/restaurant-frontend-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI

      - name: Send results to ReportPortal
        if: always()
        env:
          RP_API_KEY: ${{ secrets.RP_API_KEY }}
          RP_ENDPOINT: ${{ secrets.RP_ENDPOINT }}
        run: |
          test -f test-results/junit.xml || { echo "junit.xml not found"; exit 1; }
          rm -rf rp-upload && mkdir rp-upload
          (cd test-results && zip -q ../rp-upload/Frontend-unit-tests.zip junit.xml)
          curl -sS --fail-with-body -X POST \
            "$RP_ENDPOINT/api/v1/plugin/$RP_PROJECT/junit/import" \
            -H "Authorization: Bearer $RP_API_KEY" \
            -F "file=@rp-upload/Frontend-unit-tests.zip;type=application/x-zip-compressed"

      - name: Build
        run: npm run build